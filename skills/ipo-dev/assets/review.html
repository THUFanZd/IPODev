<style>

er-radius:9px;position:relative;padding:19px 20px 16px;box-shadow:0 6px 18px #53613c05}.route-panel:before{content:'';position:absolute;top:-1px;left:20px;right:20px;height:2px;background:#a7c176}.route-label{font:9px var(--mono);letter-spacing:1.2px;color:#91a575}.route-panel h2{font-size:14px;font-weight:600;line-height:1.6;margin:8px 0 16px}.transformation{list-style:none;padding:0;margin:0}.transformation li{display:grid;grid-template-columns:20px minmax(0,1fr);gap:9px;margin-bottom:14px;position:relative}.transformation li:last-child{margin-bottom:0}.transformation li:not(:last-child):before{content:'';width:1px;background:#d2dfbe;position:absolute;left:8px;top:20px;bottom:-11px}.transformation .number{font:9px/18px var(--mono);width:18px;height:18px;display:grid;place-items:center;background:#e2eccf;border-radius:50%;color:#86a06a}.transformation p{font-size:12px;line-height:1.9;color:#668050;margin:0;overflow-wrap:anywhere}.legacy-note{font-size:10px;color:#99a689;margin-top:12px}.empty-relation{font-size:12px;color:#8e927c;line-height:1.9}.detail-sections{display:flex;gap:20px;align-items:center;margin-top:17px;padding-top:15px;border-top:1px solid var(--line)}.technical{font-size:12px;color:#849177;margin-top:18px}.technical>summary{cursor:pointer;font-size:11px;list-style:none;color:#91a080;padding:10px 0;border-top:1px solid var(--line)}.technical>summary:before{content:'+';font:12px var(--mono);margin-right:8px}.technical[open]>summary:before{content:'−'}.technical-body{background:#fff;border:1px solid #e0e7d8;border-radius:7px;padding:20px;margin-top:7px}.technical-body h3{font-size:13px;color:#698155;font-weight:500;margin:18px 0 10px}.technical-body h3:first-child{margin-top:0}.technical-body p{line-height:1.9;font-size:12px}.mapping{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}.mapping th{font-weight:400;text-align:left;background:#f0f5e8;color:#8ca178;padding:7px 10px}.mapping td{padding:9px 10px;border-bottom:1px solid #e8e }}
@media(min-width:1500px){main{padding-top:50px}.stage-card{padding:25px 28px}.stage-card h3{font-size:19px}.connection-grid{gap:52px}.route-panel{padding:23px}}
@media(max-width:900px){header{padding:0 20px}.header-label{display:none}main{padding:30px 22px 50px}.connection-grid{grid-template-columns:1fr;gap:14px;background:none}.wires{display:none}.route-column{padding:0;margin:4px 0}.column-title{margin-bottom:10px}.io-column{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.io-column .column-title{grid-column:1/-1;margin-bottom:0}.io-card{margin:0}.port{display:none}.route-panel{padding:18px}.stage-card{padding:20px}.hero h1{font-size:29px}.detail-heading h1{font-size:26px}.trace-columns{grid-template-columns:1fr}.route-column:before,.route-column:after{content:'↓';display:block;text-align:center;color:#a5b68d;font:16px var(--mono);margin:4px 0 9px}.route-column:after{margin:9px 0 4px}}
@media(max-width:600px){header{height:auto;min-height:65px;padding:12px 16px;gap:10px;flex-wrap:wrap}.brand-name{font-size:18px}.header-right{gap:8px}.save-status{font-size:9px;max-width:140px}.button{padding:6px 9px;font-size:10px}main{padding:27px 16px 45px}.hero h1{font-size:25px}.hero p{font-size:12px}.stage-grid{grid-template-columns:1fr}.stage-card h3{font-size:17px}.stage-card{padding:18px 20px}.stage-io{gap:9px}.stage-io p{font-size:12px}.overview-caption{margin-top:24px}.overview-caption span{font-size:9px}.detail-heading{display:block}.detail-heading h1{font-size:23px}.step-navigation .button{font-size:9px}.io-column{grid-template-columns:1fr}.io-card h3{font-size:14px}.io-description{font-size:12px}.technical-body{padding:13px}.mapping th,.mapping td{padding:7px;font-size:10px}.trace{padding:10px}}

<body>
<header><button class="brand" data-home aria-label="返回环节总览"><span class="brand-mark">I/O</span><span class="brand-name">IPODev</span><span class="header-label">把实现方案，看清楚。</span></button><div class="header-right"><span id="save-status" class="save-status" role="status">正在读取批注…</span><button id="retry-save" class="save-retry" hidden>重试</button><button id="save-html" class="button">保存 HTML 副本 ↓</button></div></header>
<main><div id="view" class="view"></div><div class="footer-note">IPO DEV / IMPLEMENTATION ATLAS</div></main>
<div class="toast" id="toast" hidden role="status"></div>
<script id="ipo-model" type="application/json">/*__IPO_MODEL__*/</script>
<script id="ipo-feedback" type="application/json">/*__IPO_FEEDBACK__*/</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id),model=JSON.parse($('ipo-model').textContent),artifacts=new Map(model.artifacts.map(a=>[a.id,a]));
let feedback=JSON.parse($('ipo-feedback').textContent),token=null,connected=false,dirty=false,saving=false,ready=false,edits=0,currentId=null,navigation=0;
const selectedOutputs=new Map(),openForms=new Set(),drafts=new Map(),expanded=new Set();
const storageKey=`ipo-notes:${model.id}:${model.revision}:${location.origin}`,reduced=matchMedia('(prefers-reduced-motion: reduce)');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>typeof x==='string'?x:JSON.stringify(x,null,2),safeJson=x=>JSON.stringify(x,null,2).replace(/</g,'\\u003c'),key=(id,field)=>`${id}/${field}`;
const clip=(text,max=95)=>{const value=String(text||'').trim().replace(/\s+/g,' ');return value.length>max?value.slice(0,max-1)+'…':value;};
const artifactSummary=a=>a.summary||clip(a.fields.slice(0,2).map(f=>f.meaning).join('；'),85)||a.name;
const ioSummary=(n,type)=>n[type].summary||clip(n[type].description,90);
function derivations(n){if(n.process.derivations?.length)return n.process.derivations;return n.output.artifactIds.map(id=>({id:'output-'+id,outputId:id,inputIds:n.output.artifactIds.length===1?[...n.input.artifactIds]:[],steps:n.process.description.split(/[；。]/).filter(x=>x.trim()).map(x=>x+'。'),traceIds:n.trace.map(t=>t.id),legacy:true,uncertain:n.output.artifactIds.length>1}));}
function anchors(n){return new Set(['input','process','output',...n.input.artifactIds.concat(n.output.artifactIds).map(id=>'artifact:'+id),...n.process.rules.map(r=>'rule:'+r.id),...n.trace.map(t=>'trace:'+t.id),...n.questions.map(q=>'question:'+q.id),...derivations(n).map(d=>'derivation:'+d.id)]);}
function status(text,error=false){$('save-status').textContent=text;$('save-status').classList.toggle('error',error);}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3300);}
function stash(){try{localStorage.setItem(storageKey,JSON.stringify({feedback,dirty,drafts:[...drafts]}));}catch{status('草稿存储不可用，请保存副本',true);}}
function noteMarkup(c){return `<div class="note"><div class="note-label">批注</div>${esc(c.body)}${c.agentReply?`<div class="reply"><div class="note-label">修改说明</div>${esc(c.agentReply)}</div>`:''}</div>`;}
function annotation(n,field){const k=key(n.id,field);return `<div class="annotation" data-node="${esc(n.id)}" data-field="${esc(field)}">${feedback.comments.filter(c=>c.nodeId===n.id&&c.field===field).map(noteMarkup).join('')}<button class="add-note" data-add-note>添加批注</button><form class="note-form" ${openForms.has(k)?'':'hidden'}><textarea aria-label="批注内容" maxlength="10000" placeholder="这里需要怎样调整？">${esc(drafts.get(k)||'')}</textarea><div class="note-actions"><button type="button" data-cancel>取消</button><button type="submit" class="button dark">保存批注</button></div></form></div>`;}
function rawArtifact(n,a){const k=key(n.id,'raw:'+a.id);return `<details class="raw-data" data-expand="${esc(k)}" ${expanded.has(k)?'open':''}><summary>原始数据与字段说明</summary><div class="raw-body"><div class="source-line">${esc(a.location)}</div><div class="source-line">${esc(a.format)} · ${esc(a.id)}</div><table class="field-table"><thead><tr><th>字段</th><th>类型</th><th>含义</th></tr></thead><tbody>${a.fields.map(f=>`<tr><td>${esc(f.path)}</td><td>${esc(f.type)}</td><td>${esc(f.meaning)}</td></tr>`).join('')}</tbody></table><div class="raw-caption">${{actual:'实际内容',excerpt:'来源内容节选',illustrative:'设计 / 交互样例'}[a.sampleKind]}</div><pre class="data">${esc(pretty(a.example))}</pre></div></details>`;}
function ioCard(n,id,type,route){const a=artifacts.get(id),isOutput=type==='output',chosen=route.outputId===id,used=route.inputIds.includes(id);return `<article class="io-card ${isOutput?(chosen?'selected':''):(used?'':'unused')}" ${isOutput?`data-output-card="${esc(id)}"`:`data-input-artifact="${esc(id)}"`}><span class="port ${isOutput?'output-port':'input-port'}" aria-hidden="true"></span>${isOutput?`<button class="choose-output" data-select-output="${esc(id)}" aria-pressed="${chosen}"><h3>${esc(a.name)}</h3><p class="io-description">${esc(artifactSummary(a))}</p><span class="choose-label">${chosen?'正在展示这项输出的生成过程':'查看这项输出如何生成 ↗'}</span></button>`:`<h3>${esc(a.name)}</h3><p class="io-description">${esc(artifactSummary(a))}</p>`}<div class="artifact-footer">${rawArtifact(n,a)}</div>${annotation(n,'artifact:'+id)}</article>`;}
function overview(){return `<section class="hero"><div class="hero-top"><span class="eyebrow">Implementation map<span class="mode-label">${model.mode==='plan'?'实现方案':'现有实现'}</span></span></div><h1 id="view-title" tabindex="-1">${esc(model.title)}</h1><p>${esc(clip(model.goal,150))}</p></section><div class="overview-caption"><h2>从输入，到结果</h2><span>选择一个环节，沿连线看它如何发生 ↗</span></div><div class="stage-grid">${model.nodes.map((n,i)=>`<button class="stage-card" data-step="${esc(n.id)}"><div class="stage-top"><span class="stage-index">STEP ${String(i+1).padStart(2,'0')}${feedback.comments.some(c=>c.nodeId===n.id)?'<span class="has-notes">· 有批注</span>':''}</span><span class="stage-arrow">↗</span></div><h3>${esc(n.title)}</h3><div class="stage-io"><div><span class="label">INPUT</span><p>${esc(ioSummary(n,'input'))}</p></div><span class="arrow">→</span><div><span class="label">OUTPUT</span><p>${esc(ioSummary(n,'output'))}</p></div></div></button>`).join('')}</div><details class="scope-details"><summary>方案范围与说明</summary><p>${esc(model.scope)}</p></details>${orphaned()}`;}
function technical(n,route){const k=key(n.id,'technical'),traces=route.traceIds?n.trace.filter(t=>route.traceIds.includes(t.id)):n.trace;return `<details class="technical" data-expand="${esc(k)}" ${expanded.has(k)?'open':''}><summary>查看原始变化、字段映射与实现细节</summary><div class="technical-body">${n.process.code?`<h3>关键实现</h3><pre class="data">${esc(n.process.code)}</pre>`:''}${n.process.mappings?.length?`<h3>字段怎样转换</h3><table class="mapping"><thead><tr><th>输入</th><th>操作</th><th>输出</th></tr></thead><tbody>${n.process.mappings.map(m=>`<tr><td>${esc(m.from)}</td><td>${esc(m.operation)}</td><td>${esc(m.to)}</td></tr>`).join('')}</tbody></table>`:''}${traces.length?`<h3>相关数据变化</h3>${traces.map(t=>`<section class="trace"><div class="trace-label">${esc(t.label)}</div><div class="trace-columns"><div class="trace-part"><span class="label">变化前</span><pre class="data">${esc(pretty(t.before))}</pre></div><div class="trace-part"><span class="label">处理</span><p>${esc(t.operation)}</p></div><div class="trace-part"><span class="label">变化后</span><pre class="data">${esc(pretty(t.after))}</pre></div></div>${annotation(n,'trace:'+t.id)}</section>`).join('')}`:''}<h3>处理约定</h3><p>${esc(n.process.description)}</p>${annotation(n,'process')}<ul class="rules">${n.process.rules.map(r=>`<li class="rule">${esc(r.text)}${annotation(n,'rule:'+r.id)}</li>`).join('')}</ul>${n.process.errors.length?`<h3>边界与异常</h3><ul class="rules">${n.process.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<div class="raw-node-io"><p>输入说明：${esc(n.input.description)}</p>${annotation(n,'input')}<p>输出说明：${esc(n.output.description)}</p>${annotation(n,'output')}</div></div></details>`;}
function detail(n){const index=model.nodes.indexOf(n),routes=derivations(n),chosen=selectedOutputs.get(n.id)||n.output.artifactIds[0],route=routes.find(d=>d.outputId===chosen)||routes[0];selectedOutputs.set(n.id,route.outputId);const out=artifacts.get(route.outputId);return `<div class="detail-nav"><button class="back" data-home><span>←</span>全部环节</button><div class="step-navigation"><button class="button" ${index?'data-step="'+esc(model.nodes[index-1].id)+'"':'disabled'}>← 上一环节</button><button class="button" ${index<model.nodes.length-1?'data-step="'+esc(model.nodes[index+1].id)+'"':'disabled'}>下一环节 →</button></div></div><section class="detail-heading"><div><span class="eyebrow">STEP ${String(index+1).padStart(2,'0')} / ${String(model.nodes.length).padStart(2,'0')}</span><h1 id="view-title" tabindex="-1">${esc(n.title)}</h1><p>${esc(ioSummary(n,'input'))} → ${esc(ioSummary(n,'output'))}</p></div></section><div class="output-hint">${routes.length>1?'选择右侧的输出，查看它对应的输入与生成过程。':'沿连线查看这些输入如何变成右侧的结果。'}</div><div class="connection-grid" id="connection-grid"><svg class="wires" id="wires" aria-hidden="true"></svg><section class="io-column inputs"><div class="column-title"><span class="letter">I</span><h2>输入内容</h2><small>INPUT</small></div>${n.input.artifactIds.map(id=>ioCard(n,id,'input',route)).join('')}</section><section class="route-column"><div class="route-panel" id="route-panel"><span class="route-label">HOW IT BECOMES</span><h2>${esc(out.name)}，怎样得到？</h2>${route.uncertain?'<p class="empty-relation">这个旧模型尚未单独说明此输出的输入来源。请补充关系后再绘制连线。</p>':`<ol class="transformation">${route.steps.map((s,i)=>`<li><span class="number">${i+1}</span><p>${esc(s)}</p></li>`).join('')}</ol>`}${route.legacy&&!route.uncertain?'<div class="legacy-note">按本环节已有的输入与处理说明展示</div>':''}${annotation(n,'derivation:'+route.id)}</div></section><section class="io-column outputs"><div class="column-title"><span class="letter">O</span><h2>输出内容</h2><small>OUTPUT</small></div>${n.output.artifactIds.map(id=>ioCard(n,id,'output',route)).join('')}</section></div>${n.questions.map(q=>`<div class="question"><p>待问清楚：${esc(q.text)}</p><p>${esc(q.impact)}</p>${annotation(n,'question:'+q.id)}</div>`).join('')}${technical(n,route)}${orphaned()}`;}
function orphaned(){const valid=new Set(model.nodes.flatMap(n=>[...anchors(n)].map(f=>key(n.id,f)))),notes=feedback.comments.filter(c=>!valid.has(key(c.nodeId,c.field)));return notes.length?`<section class="orphaned"><h2>原位置已变更的批注</h2><p>保留原文，供继续修改时核对。</p>${notes.map(noteMarkup).join('')}</section>`:'';}
let observer=null,frame=0;
function drawWires(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const grid=$('connection-grid'),svg=$('wires'),panel=$('route-panel');if(!grid||!svg||!panel)return;const n=model.nodes.find(n=>n.id===currentId);if(!n)return;const route=derivations(n).find(d=>d.outputId===selectedOutputs.get(n.id));if(!route||route.uncertain){svg.innerHTML='';return;}const base=grid.getBoundingClientRect(),r=panel.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${base.width} ${base.height}`);const curve=(x1,y1,x2,y2)=>{const gap=Math.max(14,(x2-x1)*.6);return `M ${x1} ${y1} C ${x1+gap} ${y1},${x2-gap} ${y2},${x2} ${y2}`;};const left=r.left-base.left,right=r.right-base.left,mid=r.top-base.top+r.height/2;let lines='';for(const el of grid.querySelectorAll('[data-input-artifact]'))if(route.inputIds.includes(el.dataset.inputArtifact)){const p=el.querySelector('.port').getBoundingClientRect();lines+=`<path class="wire" d="${curve(p.left-base.left+p.width/2,p.top-base.top+p.height/2,left,mid)}"/>`;}const target=[...grid.querySelectorAll('[data-output-card]')].find(el=>el.dataset.outputCard===route.outputId);if(target){const p=target.querySelector('.port').getBoundingClientRect();lines+=`<path class="wire output-wire" d="${curve(right,mid,p.left-base.left+p.width/2,p.top-base.top+p.height/2)}" marker-end="url(#arrow-tip)"/>`;}svg.innerHTML=`<defs><marker id="arrow-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#648753" stroke-width="1.3"/></marker></defs>${lines}`;});}
function render(){const y=scrollY;observer?.disconnect();$('view').innerHTML=currentId?detail(model.nodes.find(n=>n.id===currentId)):overview();if($('connection-grid')){observer=new ResizeObserver(drawWires);observer.observe($('connection-grid'));drawWires();}window.scrollTo({top:y,behavior:'instant'});}
function readLocation(){const id=decodeURIComponent(location.hash.replace(/^#step-/,''));return model.nodes.some(n=>n.id===id)?id:null;}
async function navigate(id,write=true){if(id&&!model.nodes.some(n=>n.id===id))return;const turn=++navigation;$('view').classList.add('leaving');if(!reduced.matches)await new Promise(resolve=>setTimeout(resolve,145));if(turn!==navigation)return;currentId=id;if(write)history.pushState({},'',id?'#step-'+encodeURIComponent(id):'#overview');render();$('view').classList.remove('leaving');$('view').classList.add('entering');window.scrollTo({top:0,behavior:'instant'});$('view-title')?.focus({preventScroll:true});setTimeout(()=>$('view').classList.remove('entering'),260);}
async function save(){if(!connected||saving||!dirty)return;saving=true;const attempt=edits;status('正在保存批注…');$('retry-save').hidden=true;try{const response=await fetch('/api/feedback',{method:'PUT',headers:{'Content-Type':'application/json','x-ipo-token':token},body:JSON.stringify({baseVersion:feedback.version,feedback:structuredClone(feedback)})});const result=await response.json();if(!response.ok)throw Error(result.error||'保存失败');feedback.version=result.version;if(attempt===edits)dirty=false;stash();status(dirty?'正在保存…':'批注已写入 HTML');}catch(error){status('保存未完成，请重试或保存副本',true);$('retry-save').hidden=false;toast(error.message);}finally{saving=false;if(dirty&&edits!==attempt)save();}}
document.addEventListener('click',event=>{const home=event.target.closest('[data-home]'),step=event.target.closest('[data-step]'),output=event.target.closest('[data-select-output]'),add=event.target.closest('[data-add-note]'),cancel=event.target.closest('[data-cancel]');if(home){navigate(null);return;}if(step){navigate(step.dataset.step);return;}if(output){selectedOutputs.set(currentId,output.dataset.selectOutput);render();return;}if(add){const wrapper=add.closest('.annotation');openForms.add(key(wrapper.dataset.node,wrapper.dataset.field));wrapper.querySelector('form').hidden=false;wrapper.querySelector('textarea').focus();drawWires();}if(cancel){const w=cancel.closest('.annotation'),k=key(w.dataset.node,w.dataset.field);openForms.delete(k);drafts.delete(k);w.querySelector('textarea').value='';w.querySelector('form').hidden=true;stash();drawWires();}});
document.addEventListener('toggle',event=>{const el=event.target;if(el.matches('details[data-expand]')){if(el.open)expanded.add(el.dataset.expand);else expanded.delete(el.dataset.expand);drawWires();}},true);
document.addEventListener('input',event=>{if(event.target.matches('.note-form textarea')){const w=event.target.closest('.annotation');drafts.set(key(w.dataset.node,w.dataset.field),event.target.value);stash();}});
document.addEventListener('submit',event=>{if(!event.target.matches('.note-form'))return;event.preventDefault();if(!ready){toast('正在读取原有批注，请稍候');return;}const w=event.target.closest('.annotation'),body=w.querySelector('textarea').value.trim();if(!body){toast('请先填写批注');return;}feedback.comments.push({id:crypto.randomUUID(),nodeId:w.dataset.node,field:w.dataset.field,body,createdAt:new Date().toISOString(),agentReply:''});const k=key(w.dataset.node,w.dataset.field);drafts.delete(k);openForms.delete(k);dirty=true;edits++;stash();render();if(connected)save();else{status('批注在浏览器中，请保存副本',true);toast('请保存 HTML 副本交给 agent');}});
$('retry-save').onclick=save;
$('save-html').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#ipo-model').textContent=safeJson(model);clone.querySelector('#ipo-feedback').textContent=safeJson(feedback);clone.querySelectorAll('.note-form').forEach(form=>{form.hidden=true;form.querySelector('textarea').textContent='';});const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`${model.id}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('副本已包含当前批注');};
window.addEventListener('popstate',()=>navigate(readLocation(),false));window.addEventListener('resize',drawWires);window.addEventListener('beforeunload',event=>{if(dirty||[...drafts.values()].some(x=>x.trim())){event.preventDefault();event.returnValue='';}});
currentId=readLocation();render();
async function init(){let local;try{local=JSON.parse(localStorage.getItem(storageKey)||'null');}catch{}if(location.protocol==='http:'||location.protocol==='https:')try{const response=await fetch('/api/state',{signal:AbortSignal.timeout(3500)});if(!response.ok)throw Error();const state=await response.json();if(state.projectId!==model.id||state.projectRevision!==model.revision)throw Error();feedback=state.feedback;token=state.token;connected=true;}catch{}if(local?.feedback?.projectId===model.id){for(const [k,v]of local.drafts||[])drafts.set(k,v);if(local.dirty){const known=new Set(feedback.comments.map(c=>c.id));for(const c of local.feedback.comments)if(!known.has(c.id)){feedback.comments.push(c);dirty=true;}}}status(connected?'批注将保存到 HTML':'离线模式 · 批注后请保存副本',!connected);ready=true;render();if(dirty&&connected)save();}
init();
})();
</script>
</body>
</html>
