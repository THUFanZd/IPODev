<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>IPODev · 实现方案</title>
<style>
:root {
  color-scheme: light;
  --bg: #f3f5f2;
  --paper: #ffffff;
  --ink: #1e3028;
  --muted: #58695f;
  --line: #d3ddd5;
  --green: #285b43;
  --lime: #e3edd8;
  --surface: #eaf0e9;
  --soft-line: #e7ece7;
  --mono: Consolas, 'Cascadia Code', monospace;
  --sans: 'Microsoft YaHei UI', 'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.75 var(--sans); -webkit-font-smoothing: antialiased; }
button, textarea, summary { font: inherit; }
button, a, summary { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; border: 0; background: none; color: inherit; }
a { color: var(--green); text-underline-offset: 3px; }
button:focus-visible, a:focus-visible, textarea:focus-visible, summary:focus-visible { outline: 3px solid #6b9479; outline-offset: 4px; }
button:disabled { cursor: default; opacity: .42; }
button { transition: background-color .16s, border-color .16s, box-shadow .16s; }
header { min-height: 76px; background: var(--paper); border-bottom: 1px solid var(--line); padding: 14px 32px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
.brand { display: flex; gap: 12px; align-items: center; padding: 0; }
.brand-mark { width: 35px; height: 35px; border-radius: 8px; background: var(--green); color: white; display: grid; place-items: center; font: 13px var(--mono); letter-spacing: -1px; }
.brand-name { font-size: 21px; font-weight: 650; letter-spacing: -.6px; }
.header-label { color: var(--muted); font-size: 13px; border-left: 1px solid var(--line); padding-left: 18px; margin-left: 6px; }
.header-right { display: flex; align-items: center; gap: 14px; }
.save-status { color: var(--muted); font-size: 12px; }
.save-status::before { content: ''; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: #648b6f; margin-right: 7px; vertical-align: 2px; }
.save-status.error { color: #79551f; }
.save-status.error::before { background: #a87628; }
.button { display: inline-flex; align-items: center; justify-content: center; min-height: 36px; font-size: 13px; padding: 7px 13px; border: 1px solid #c7d3ca; border-radius: 7px; background: var(--paper); }
.button:hover:not(:disabled) { border-color: #789882; background: #f4f8f2; }
.button.dark { background: var(--green); color: white; border-color: var(--green); }
.button.dark:hover { background: #204b36; }
.save-retry { color: var(--green); font-size: 13px; text-decoration: underline; }
main { max-width: 1480px; padding: 26px 40px 56px; margin: 0 auto; }
.view-toolbar { display: flex; align-items: center; justify-content: flex-end; gap: 13px; margin-bottom: 24px; }
.view-toolbar > span { font-size: 12px; color: var(--muted); }
.view-switch { display: inline-flex; gap: 3px; padding: 4px; background: #e5ebe4; border: 1px solid var(--line); border-radius: 9px; }
.view-switch button { font-size: 13px; padding: 7px 17px; border-radius: 6px; color: #4e6255; }
.view-switch button[aria-pressed="true"] { background: var(--paper); color: #204d36; box-shadow: 0 1px 4px #1e302815; font-weight: 600; }
.view-switch button small { display: none; }
.view { transition: opacity .15s ease, transform .15s ease; min-height: 58vh; }
.view.leaving { opacity: 0; transform: translateY(3px); }
.view.entering { animation: enter .22s ease-out; }
.hero { max-width: 1050px; padding: 6px 0 8px; }
.hero-top { display: flex; align-items: center; gap: 10px; }
.eyebrow { font-size: 12px; font-weight: 500; color: var(--muted); }
.mode-label { display: inline-block; font-size: 12px; padding: 3px 9px; background: #e4ede2; border: 1px solid #d0dece; border-radius: 5px; color: #3e6247; margin-left: 12px; }
.hero h1 { font-size: clamp(28px, 2.7vw, 38px); font-weight: 600; letter-spacing: -.8px; line-height: 1.45; margin: 13px 0 12px; text-wrap: balance; }
.hero p { font-size: 15px; max-width: 880px; color: var(--muted); margin: 0; line-height: 1.9; }
.overview-caption { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; margin: 25px 0 17px; padding-top: 22px; border-top: 1px solid var(--line); }
.overview-caption h2 { font-size: 17px; font-weight: 600; margin: 0; }
.overview-caption > span { font-size: 12px; color: var(--muted); }
.stage-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; }
.stage-card { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--paper); border-radius: 12px; padding: 21px 25px 25px; position: relative; }
.stage-card:hover { border-color: #809d86; box-shadow: 0 4px 18px #1e30280b; }
.stage-card:focus-visible { border-color: var(--green); }
.stage-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
.stage-index { font-size: 12px; font-weight: 500; color: #47634e; font-variant-numeric: tabular-nums; }
.stage-arrow { width: 28px; height: 28px; display: grid; place-items: center; color: var(--green); font-size: 21px; line-height: 1; }
.stage-card h3 { font-size: 21px; letter-spacing: -.3px; font-weight: 600; margin: 0 0 21px; line-height: 1.5; }
.stage-io { display: grid; grid-template-columns: 1fr 18px 1fr; gap: 15px; align-items: start; padding-top: 16px; border-top: 1px solid var(--soft-line); }
.stage-io .label { font-size: 12px; font-weight: 500; color: var(--muted); }
.stage-io p { font-size: 14px; line-height: 1.85; margin: 6px 0 0; color: var(--ink); overflow-wrap: anywhere; }
.stage-io .arrow { padding-top: 25px; color: #7c9580; }
.stage-io > div:last-child .label { color: var(--green); }
.has-notes { font-size: 12px; color: #597348; margin-left: 10px; font-weight: 400; }
.scope-details { margin-top: 25px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); }
.scope-details summary { font-size: 13px; cursor: pointer; color: var(--muted); }
.scope-details p { max-width: 900px; line-height: 1.9; }
.detail-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 19px; gap: 12px; }
.back { font-size: 13px; color: var(--green); padding: 4px 0; display: flex; align-items: center; gap: 9px; }
.back span { font-size: 18px; }
.step-navigation { display: flex; gap: 7px; }
.detail-heading { display: flex; align-items: center; justify-content: space-between; gap: 20px; margin-bottom: 17px; }
.detail-heading h1 { font-size: 30px; line-height: 1.45; letter-spacing: -.6px; font-weight: 600; margin: 7px 0 8px; }
.detail-heading p { font-size: 14px; color: var(--muted); margin: 0; line-height: 1.85; max-width: 1000px; }
.output-hint { font-size: 12px; color: var(--muted); margin: 13px 0 8px; }
.connection-grid { display: grid; grid-template-columns: minmax(190px, 1fr) minmax(245px, 1.18fr) minmax(190px, 1fr); gap: 38px; position: relative; padding: 16px 0 22px; align-items: start; }
.wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; overflow: visible; }
.wire { fill: none; stroke: #62856c; stroke-width: 1.7; stroke-linecap: round; opacity: .9; }
.wire.output-wire { stroke: var(--green); stroke-width: 2; }
.wire.uncertain { stroke-dasharray: 4 6; opacity: .5; }
.io-column { min-width: 0; position: relative; z-index: 2; }
.column-title { display: flex; align-items: center; gap: 10px; margin-bottom: 13px; min-height: 28px; }
.column-title .letter { font: 13px var(--mono); color: var(--green); width: 25px; height: 25px; background: #e2ebdf; border-radius: 5px; display: grid; place-items: center; }
.column-title h2 { font-size: 14px; font-weight: 600; margin: 0; }
.column-title small { display: none; }
.io-card { background: var(--paper); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 14px; position: relative; padding: 19px 18px 14px; min-width: 0; transition: border-color .16s, background-color .16s; }
.io-card.unused { background: #eef1ed; border-style: dashed; }
.io-card.unused h3, .io-card.unused .io-description { color: #69766c; }
.io-card.selected { border-color: #5d8667; box-shadow: inset 3px 0 var(--green); }
.port { width: 8px; height: 8px; border-radius: 50%; border: 2px solid #64886d; background: var(--paper); position: absolute; top: 29px; z-index: 3; }
.input-port { right: -5px; }
.output-port { left: -5px; }
.io-card.unused .port { border-color: #a1b2a3; }
.io-card h3 { font-size: 17px; font-weight: 600; line-height: 1.6; margin: 0 0 8px; letter-spacing: -.2px; }
.io-description { font-size: 15px; color: #465c4d; line-height: 1.9; margin: 0; overflow-wrap: anywhere; }
.choose-output { display: block; text-align: left; padding: 0; width: 100%; border-radius: 2px; }
.choose-label { font-size: 12px; color: #536b58; display: block; margin-top: 13px; }
.selected .choose-label { color: #285b43; font-weight: 500; }
.input-source { display: inline-block; margin-top: 11px; font-size: 12px; color: #3f6249; background: #edf3e8; border: 1px solid #dde8d6; border-radius: 5px; padding: 2px 7px; }
.artifact-footer { border-top: 1px solid var(--soft-line); padding-top: 11px; margin-top: 17px; }
.raw-data { width: 100%; }
.raw-data summary { cursor: pointer; list-style: none; color: #52685a; font-size: 12px; }
.raw-data summary::-webkit-details-marker { display: none; }
.raw-data summary::before { content: '+'; display: inline-block; width: 16px; font: 14px var(--mono); color: var(--green); }
.raw-data[open] summary::before { content: '−'; }
.raw-body { border-top: 1px solid var(--soft-line); margin-top: 12px; padding-top: 11px; }
.source-line { font: 12px/1.8 var(--mono); overflow-wrap: anywhere; color: var(--muted); margin: 6px 0; }
.raw-caption { font-size: 12px; color: var(--muted); margin-top: 14px; }
.field-table { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 12px; line-height: 1.8; margin-top: 12px; }
.field-table th { text-align: left; font-weight: 500; color: var(--muted); padding: 6px 3px; border-bottom: 1px solid var(--line); }
.field-table td { vertical-align: top; overflow-wrap: anywhere; border-bottom: 1px solid var(--soft-line); padding: 7px 3px; color: #465c4d; }
.field-table td:first-child { font-family: var(--mono); color: #285b43; }
.field-table th:first-child { width: 35%; }
.field-table th:nth-child(2) { width: 22%; }
.data { font: 12px/1.85 var(--mono); background: #f1f4ef; color: #334d3b; padding: 13px; white-space: pre-wrap; overflow-wrap: anywhere; max-height: 330px; overflow: auto; border-radius: 5px; margin: 8px 0; border: 1px solid #e2e8df; }
.route-column { position: relative; z-index: 2; align-self: start; min-width: 0; padding-top: 41px; }
.route-panel { background: #e9f0e5; border: 1px solid #cad9c6; border-radius: 10px; position: relative; padding: 20px 21px 17px; }
.route-label { display: block; font-size: 12px; color: #4e6951; font-weight: 500; }
.route-panel h2 { font-size: 18px; font-weight: 600; line-height: 1.6; margin: 7px 0 19px; }
.route-panel.visual-route { background: var(--paper); }
.process-visual { margin: 0 -8px; }
.visual-canvas { display: block; position: relative; contain: layout paint; isolation: isolate; overflow: hidden; border-radius: 6px; background: #f5f7f3; }
.visual-caption { min-height: 100px; padding: 17px 8px 7px; }
.visual-caption h3 { margin: 0 0 7px; font-size: 16px; font-weight: 600; color: var(--ink); }
.visual-caption p { margin: 0; font-size: 14px; line-height: 1.8; color: #465c4d; }
.visual-controls { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; padding: 12px 8px; border-bottom: 1px solid var(--soft-line); }
.visual-controls button { padding: 6px 9px; border: 1px solid var(--line); border-radius: 5px; font-size: 12px; background: var(--paper); }
.visual-controls button[data-visual-action="play"] { background: var(--green); border-color: var(--green); color: white; min-width: 56px; }
.visual-controls button:disabled { opacity: .4; cursor: default; }
.visual-controls[hidden], .visual-progress[hidden] { display: none; }
.visual-count { font: 12px var(--mono); color: var(--muted); margin-left: auto; }
.visual-progress { display: flex; gap: 5px; padding: 5px 8px 12px; }
.visual-progress button { flex: 1; height: 16px; padding: 5px 0; }
.visual-progress button::after { content: ''; display: block; height: 3px; border-radius: 3px; background: #dbe3d7; }
.visual-progress button[aria-current="step"]::after { background: var(--green); }
.visual-frame-note { padding: 0 8px; }
.visual-text { font-size: 13px; line-height: 1.8; margin-top: 15px; border-top: 1px solid var(--soft-line); padding-top: 12px; }
.visual-text > summary { cursor: pointer; color: var(--muted); }
.visual-text .transformation { margin-top: 15px; }
.visual-text .transformation p { font-size: 13px; }
.visual-error { color: #765923; padding: 15px; font-size: 14px; }
.transformation { list-style: none; padding: 0; margin: 0; }
.transformation li { display: grid; grid-template-columns: 24px minmax(0, 1fr); gap: 11px; margin-bottom: 21px; position: relative; }
.transformation li:last-child { margin-bottom: 0; }
.transformation li:not(:last-child)::before { content: ''; width: 1px; background: #b6cbb0; position: absolute; left: 11px; top: 27px; bottom: -15px; }
.transformation .number { font: 12px/24px var(--mono); width: 24px; height: 24px; display: grid; place-items: center; background: #d6e3ce; border-radius: 50%; color: #335e3c; }
.transformation p { font-size: 15px; line-height: 1.9; color: #304b37; margin: 0; overflow-wrap: anywhere; }
.legacy-note, .empty-relation { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.9; }
.detail-sections { display: flex; gap: 20px; align-items: center; margin-top: 17px; padding-top: 15px; border-top: 1px solid var(--line); }
.technical { font-size: 14px; color: var(--muted); margin-top: 16px; }
.technical > summary { cursor: pointer; font-size: 13px; list-style: none; color: #496653; padding: 15px 0; border-top: 1px solid var(--line); }
.technical > summary::before { content: '+'; font: 15px var(--mono); margin-right: 9px; }
.technical[open] > summary::before { content: '−'; }
.technical-body { background: var(--paper); border: 1px solid var(--line); border-radius: 9px; padding: 22px; margin-top: 5px; }
.technical-body h3 { font-size: 16px; color: #2c5338; font-weight: 600; margin: 23px 0 12px; }
.technical-body h3:first-child { margin-top: 0; }
.technical-body p { line-height: 1.9; font-size: 14px; }
.mapping { width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 13px; }
.mapping th { font-weight: 500; text-align: left; background: #eef3e9; color: #405c47; padding: 9px 11px; }
.mapping td { padding: 11px; border-bottom: 1px solid var(--soft-line); vertical-align: top; overflow-wrap: anywhere; }
.trace { border: 1px solid var(--line); border-radius: 7px; margin: 14px 0; padding: 16px; }
.trace-label { font-size: 14px; font-weight: 500; color: #35583e; margin-bottom: 11px; }
.trace-columns { display: grid; grid-template-columns: 1fr .9fr 1fr; gap: 18px; }
.trace-part { min-width: 0; }
.trace-part .label { font-size: 12px; color: var(--muted); }
.trace-part p { margin: 6px 0; }
.rules { padding-left: 20px; font-size: 14px; line-height: 1.9; }
.rule { margin: 12px 0; }
.question { border: 1px solid #d8c9a3; border-radius: 8px; background: #faf4e5; padding: 15px 18px; margin: 18px 0; font-size: 14px; color: #765923; }
.question p { margin: 4px 0; }
.annotation { margin-top: 10px; min-width: 0; }
.add-note { font-size: 12px; color: #516e58; padding: 3px 0; }
.add-note:hover { color: #204b34; text-decoration: underline; text-underline-offset: 3px; }
.add-note::before { content: '+'; margin-right: 6px; font-family: var(--mono); }
.note { border-left: 2px solid #86a56c; background: #f0f5e9; padding: 10px 12px; margin: 11px 0; font-size: 13px; line-height: 1.9; white-space: pre-wrap; overflow-wrap: anywhere; color: #334d3b; }
.note-label { font-size: 12px; color: #526e48; font-weight: 500; margin-bottom: 4px; }
.reply { border-top: 1px solid #d9e5ce; margin-top: 10px; padding-top: 9px; color: #46633d; }
.note-form { margin-top: 10px; }
.note-form textarea { width: 100%; min-height: 96px; resize: vertical; background: var(--paper); border: 1px solid #a6bfa0; border-radius: 6px; padding: 11px; font: 14px/1.8 var(--sans); color: var(--ink); }
.note-form textarea::placeholder { color: #68766b; }
.note-actions { display: flex; justify-content: flex-end; gap: 13px; margin-top: 8px; align-items: center; }
.note-actions button { font-size: 13px; }
.orphaned { border-top: 1px solid var(--line); padding-top: 22px; margin-top: 26px; }
.orphaned h2 { font-size: 17px; }
.orphaned p { font-size: 14px; color: var(--muted); }
.toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #294b35; color: var(--paper); padding: 12px 18px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: 90vw; box-shadow: 0 4px 22px #1e30281f; }
.footer-note { font-size: 12px; color: #627367; margin-top: 30px; padding-top: 18px; border-top: 1px solid var(--line); }
.raw-node-io { margin-top: 16px; font-size: 14px; color: var(--muted); }
.example-banner { display: flex; gap: 20px; align-items: center; justify-content: space-between; background: #eaf0e7; border: 1px solid #cfdcc8; border-radius: 9px; padding: 16px 20px; margin: 19px 0 16px; }
.example-banner h2 { font-size: 15px; margin: 0 0 5px; font-weight: 600; }
.example-banner p { font-size: 13px; color: #4e6654; margin: 0; line-height: 1.85; }
.example-badge { font-size: 12px; color: #526842; white-space: nowrap; padding: 4px 9px; border: 1px solid #bfceaf; border-radius: 5px; background: #f5f8ef; }
.example-empty { padding: 30px; border: 1px dashed #acbea3; border-radius: 10px; background: #fafcf7; margin-top: 22px; }
.example-empty h2 { font-size: 20px; margin: 0 0 12px; font-weight: 500; }
.example-empty p { font-size: 14px; color: var(--muted); max-width: 680px; }
.example-empty button { margin-top: 12px; }
.example-change { margin: 0 0 17px; padding: 16px; background: #fcfdfa; border: 1px solid #d2dfca; border-radius: 7px; min-width: 0; }
.example-change:last-child { margin-bottom: 0; }
.change-index { color: #345c3e; font-size: 12px; font-weight: 600; padding-bottom: 10px; margin-bottom: 10px; border-bottom: 1px solid #e0e8da; }
.change-label { font-size: 12px; font-weight: 500; color: #56694e; }
.example-change p { font-size: 15px; line-height: 1.85; color: #314b37; margin: 5px 0 0; overflow-wrap: anywhere; }
.change-action { border-left: 2px solid #82a56b; margin: 13px 0; padding: 8px 0 8px 12px; }
.change-result { border-top: 1px solid #e0e8d9; padding-top: 11px; }
.change-result p { color: #224b31; font-weight: 500; }
.example-route h2 { margin-bottom: 16px; }
#view-title:focus { outline: none; }
[hidden] { display: none !important; }
@keyframes enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
@media (min-width: 1500px) {
  main { padding-top: 30px; }
  .connection-grid { gap: 46px; }
  .stage-card { padding: 23px 28px 27px; }
}
@media (max-width: 960px) {
  header { padding-inline: 22px; }
  .header-label { display: none; }
  main { padding: 23px 24px 48px; }
  .connection-grid { grid-template-columns: 1fr; gap: 16px; }
  .wires { display: none; }
  .route-column { padding: 0; margin: 0; }
  .column-title { margin-bottom: 0; grid-column: 1 / -1; }
  .io-column { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
  .io-card { margin: 0; }
  .port { display: none; }
  .route-column::before, .route-column::after { content: '↓'; display: block; text-align: center; color: #63805c; font: 20px var(--mono); margin: 0 0 12px; }
  .route-column::after { margin: 12px 0 0; }
  .trace-columns { grid-template-columns: 1fr; }
}
@media (max-width: 620px) {
  header { min-height: 68px; padding: 13px 17px; gap: 10px; flex-wrap: wrap; }
  .brand-name { font-size: 19px; }
  .brand-mark { width: 31px; height: 31px; font-size: 12px; }
  .header-right { gap: 9px; }
  .save-status { font-size: 11px; }
  .button { min-height: 34px; font-size: 12px; padding: 6px 10px; }
  main { padding: 20px 17px 38px; }
  .view-toolbar { justify-content: space-between; gap: 8px; margin-bottom: 22px; }
  .view-toolbar > span { font-size: 12px; }
  .view-switch button { font-size: 12px; padding: 7px 12px; }
  .hero h1 { font-size: 27px; letter-spacing: -.4px; }
  .hero p { font-size: 14px; }
  .stage-grid { grid-template-columns: 1fr; gap: 14px; }
  .stage-card { padding: 18px 20px 22px; }
  .stage-card h3 { font-size: 19px; margin-bottom: 18px; }
  .stage-io { gap: 11px; }
  .overview-caption { align-items: start; flex-direction: column; gap: 4px; margin-top: 20px; padding-top: 18px; }
  .overview-caption h2 { font-size: 16px; }
  .detail-heading { display: block; }
  .detail-heading h1 { font-size: 26px; }
  .detail-heading p { font-size: 13px; }
  .detail-nav { gap: 8px; margin-bottom: 18px; }
  .step-navigation { gap: 5px; }
  .io-column { grid-template-columns: 1fr; }
  .io-card { padding: 18px 17px 14px; }
  .route-panel { padding: 18px; }
  .route-panel h2 { font-size: 18px; }
  .technical-body { padding: 16px; }
  .mapping th, .mapping td { padding: 8px; font-size: 12px; }
  .trace { padding: 12px; }

}

<body>
<header><button class="brand" data-home aria-label="返回环节总览"><span class="brand-mark">I/O</span><span class="brand-name">IPODev</span><span class="header-label">输入、处理与输出</span></button><div class="header-right"><span id="save-status" class="save-status" role="status">正在读取批注…</span><button id="retry-save" class="save-retry" hidden>重试</button><button id="save-html" class="button">保存 HTML 副本 ↓</button></div></header>
<main><div class="view-toolbar"><span>展示方式</span><div class="view-switch" role="group" aria-label="展示方式"><button data-presentation="description" aria-pressed="true">方案说明</button><button data-presentation="example" aria-pressed="false">具体示例</button></div></div><div id="view" class="view"></div><div class="footer-note">IPODev　输入、处理与输出</div></main>
<div class="toast" id="toast" hidden role="status"></div>
<script id="ipo-model" type="application/json">/*__IPO_MODEL__*/</script>
<script id="ipo-feedback" type="application/json">/*__IPO_FEEDBACK__*/</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id),model=JSON.parse($('ipo-model').textContent),artifacts=new Map(model.artifacts.map(a=>[a.id,a]));
let feedback=JSON.parse($('ipo-feedback').textContent),token=null,connected=false,dirty=false,saving=false,ready=false,edits=0,currentId=null,navigation=0;
const selectedOutputs=new Map(),openForms=new Set(),drafts=new Map(),expanded=new Set();
const visualPositions=new Map();let player=null;
let presentation='description';
const example=model.runningExample,exampleValues=new Map((example?.values||[]).map(v=>[v.artifactId,v]));
const inExample=()=>presentation==='example',exampleStep=n=>example?.steps.find(s=>s.nodeId===n.id);
const storageKey=`ipo-notes:${model.id}:${model.revision}:${location.origin}`,reduced=matchMedia('(prefers-reduced-motion: reduce)');
const esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pretty=x=>typeof x==='string'?x:JSON.stringify(x,null,2),safeJson=x=>JSON.stringify(x,null,2).replace(/</g,'\\u003c'),key=(id,field)=>`${id}/${field}`;
const clip=(text,max=95)=>{const value=String(text||'').trim().replace(/\s+/g,' ');return value.length>max?value.slice(0,max-1)+'…':value;};
const artifactSummary=a=>a.summary||clip(a.fields.slice(0,2).map(f=>f.meaning).join('；'),85)||a.name;
const ioSummary=(n,type)=>inExample()?clip(n[type].artifactIds.map(id=>exampleValues.get(id)?.summary||'尚无示例内容').join('；'),160):(n[type].summary||clip(n[type].description,90));
function derivations(n){if(n.process.derivations?.length)return n.process.derivations;return n.output.artifactIds.map(id=>({id:'output-'+id,outputId:id,inputIds:n.output.artifactIds.length===1?[...n.input.artifactIds]:[],steps:n.process.description.split(/[；。]/).filter(x=>x.trim()).map(x=>x+'。'),traceIds:n.trace.map(t=>t.id),legacy:true,uncertain:n.output.artifactIds.length>1}));}
function anchors(n){const s=exampleStep(n);return new Set(['input','process','output',...n.input.artifactIds.concat(n.output.artifactIds).map(id=>'artifact:'+id),...n.process.rules.map(r=>'rule:'+r.id),...n.trace.map(t=>'trace:'+t.id),...n.questions.map(q=>'question:'+q.id),...derivations(n).flatMap(d=>['derivation:'+d.id,...(d.visual?.frames||[]).map(f=>`visual:${d.id}:${f.id}`)]),...(s?[...n.input.artifactIds.concat(n.output.artifactIds).map(id=>'example:artifact:'+id),...s.outputs.flatMap(o=>['example:output:'+o.outputId,...o.changes.map(c=>'example:change:'+c.id),...(o.visual?.frames||[]).map(f=>`example:visual:${o.outputId}:${f.id}`)])]:[])]);}
function status(text,error=false){$('save-status').textContent=text;$('save-status').classList.toggle('error',error);}
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').hidden=true,3300);}
function stash(){try{localStorage.setItem(storageKey,JSON.stringify({feedback,dirty,drafts:[...drafts]}));}catch{status('草稿存储不可用，请保存副本',true);}}
function noteMarkup(c){return `<div class="note"><div class="note-label">批注</div>${esc(c.body)}${c.agentReply?`<div class="reply"><div class="note-label">修改说明</div>${esc(c.agentReply)}</div>`:''}</div>`;}
function annotation(n,field){const k=key(n.id,field);return `<div class="annotation" data-node="${esc(n.id)}" data-field="${esc(field)}">${feedback.comments.filter(c=>c.nodeId===n.id&&c.field===field).map(noteMarkup).join('')}<button class="add-note" data-add-note>添加批注</button><form class="note-form" ${openForms.has(k)?'':'hidden'}><textarea aria-label="批注内容" maxlength="10000" placeholder="这里需要怎样调整？">${esc(drafts.get(k)||'')}</textarea><div class="note-actions"><button type="button" data-cancel>取消</button><button type="submit" class="button dark">保存批注</button></div></form></div>`;}
function sourceLabel(a){if(!a.producedBy)return '原始输入';const i=model.nodes.findIndex(n=>n.id===a.producedBy);return i<0?'来源待确认':`来自第 ${i+1} 步的输出`;}
function exampleBanner(){if(!inExample())return '';if(!example)return `<section class="example-empty"><h2>还没有贯穿流程的具体示例</h2><p>当前模型只有方案说明。请让 agent 按 skill 补充 runningExample，用同一组具体数据串起各环节；零散的数据样本不会被当作完整运行示例。</p><button class="button" data-presentation="description">返回方案说明</button></section>`;return `<section class="example-banner"><div><h2>${esc(example.title)}</h2><p>${esc(example.summary)}</p></div><span class="example-badge">${{actual:'已核实的实际内容',excerpt:'实际内容节选',illustrative:'示意案例 · 非执行结果'}[example.sampleKind]}</span></section>`;}
function rawArtifact(n,a){const k=key(n.id,(inExample()?'example-raw:':'raw:')+a.id),value=inExample()?exampleValues.get(a.id)?.value:a.example;return `<details class="raw-data" data-expand="${esc(k)}" ${expanded.has(k)?'open':''}><summary>${inExample()?'本例原始数据与字段说明':'原始数据与字段说明'}</summary><div class="raw-body"><div class="source-line">${esc(a.location)}</div><div class="source-line">${esc(a.format)} · ${esc(a.id)}</div><table class="field-table"><thead><tr><th>字段</th><th>类型</th><th>含义</th></tr></thead><tbody>${a.fields.map(f=>`<tr><td>${esc(f.path)}</td><td>${esc(f.type)}</td><td>${esc(f.meaning)}</td></tr>`).join('')}</tbody></table><div class="raw-caption">${{actual:'实际内容',excerpt:'来源内容节选',illustrative:'设计 / 交互样例'}[inExample()?example.sampleKind:a.sampleKind]}</div><pre class="data">${esc(pretty(value))}</pre></div></details>`;}
function ioCard(n,id,type,route){const a=artifacts.get(id),isOutput=type==='output',chosen=route.outputId===id,used=route.inputIds.includes(id),summary=inExample()?exampleValues.get(id).summary:artifactSummary(a);return `<article class="io-card ${isOutput?(chosen?'selected':''):(used?'':'unused')}" ${isOutput?`data-output-card="${esc(id)}"`:`data-input-artifact="${esc(id)}"`}><span class="port ${isOutput?'output-port':'input-port'}" aria-hidden="true"></span>${isOutput?`<button class="choose-output" data-select-output="${esc(id)}" aria-pressed="${chosen}"><h3>${esc(a.name)}</h3><p class="io-description">${esc(summary)}</p><span class="choose-label">${chosen?'当前查看的输出':'查看生成过程'}</span></button>`:`<h3>${esc(a.name)}</h3><p class="io-description">${esc(summary)}</p><span class="input-source">${esc(sourceLabel(a))}</span>`}<div class="artifact-footer">${rawArtifact(n,a)}</div>${annotation(n,(inExample()?'example:artifact:':'artifact:')+id)}</article>`;}
function overview(){const hero=`<section class="hero"><div class="hero-top"><span class="eyebrow">功能流程<span class="mode-label">${model.mode==='plan'?'实现方案':'现有实现'}</span></span></div><h1 id="view-title" tabindex="-1">${esc(model.title)}</h1><p>${esc(clip(model.goal,150))}</p></section>`;if(inExample()&&!example)return hero+exampleBanner()+orphaned();return `${hero}${exampleBanner()}<div class="overview-caption"><h2>${inExample()?'同一个例子，从头走到尾':'从输入，到结果'}</h2><span>选择环节，查看输入、处理和结果</span></div><div class="stage-grid">${model.nodes.map((n,i)=>`<button class="stage-card" data-step="${esc(n.id)}"><div class="stage-top"><span class="stage-index">第 ${String(i+1).padStart(2,'0')} 步${feedback.comments.some(c=>c.nodeId===n.id)?'<span class="has-notes">· 有批注</span>':''}</span><span class="stage-arrow" aria-hidden="true">›</span></div><h3>${esc(n.title)}</h3><div class="stage-io"><div><span class="label">输入</span><p>${esc(ioSummary(n,'input'))}</p></div><span class="arrow">→</span><div><span class="label">输出</span><p>${esc(ioSummary(n,'output'))}</p></div></div></button>`).join('')}</div><details class="scope-details"><summary>方案范围与说明</summary><p>${esc(model.scope)}</p></details>${orphaned()}`;}
function technical(n,route){const k=key(n.id,'technical'),traces=route.traceIds?n.trace.filter(t=>route.traceIds.includes(t.id)):n.trace;return `<details class="technical" data-expand="${esc(k)}" ${expanded.has(k)?'open':''}><summary>查看原始变化、字段映射与实现细节</summary><div class="technical-body">${n.process.code?`<h3>关键实现</h3><pre class="data">${esc(n.process.code)}</pre>`:''}${n.process.mappings?.length?`<h3>字段怎样转换</h3><table class="mapping"><thead><tr><th>输入</th><th>操作</th><th>输出</th></tr></thead><tbody>${n.process.mappings.map(m=>`<tr><td>${esc(m.from)}</td><td>${esc(m.operation)}</td><td>${esc(m.to)}</td></tr>`).join('')}</tbody></table>`:''}${traces.length?`<h3>相关数据变化</h3>${traces.map(t=>`<section class="trace"><div class="trace-label">${esc(t.label)}</div><div class="trace-columns"><div class="trace-part"><span class="label">变化前</span><pre class="data">${esc(pretty(t.before))}</pre></div><div class="trace-part"><span class="label">处理</span><p>${esc(t.operation)}</p></div><div class="trace-part"><span class="label">变化后</span><pre class="data">${esc(pretty(t.after))}</pre></div></div>${annotation(n,'trace:'+t.id)}</section>`).join('')}`:''}<h3>处理约定</h3><p>${esc(n.process.description)}</p>${annotation(n,'process')}<ul class="rules">${n.process.rules.map(r=>`<li class="rule">${esc(r.text)}${annotation(n,'rule:'+r.id)}</li>`).join('')}</ul>${n.process.errors.length?`<h3>边界与异常</h3><ul class="rules">${n.process.errors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>`:''}<div class="raw-node-io"><p>输入说明：${esc(n.input.description)}</p>${annotation(n,'input')}<p>输出说明：${esc(n.output.description)}</p>${annotation(n,'output')}</div></div></details>`;}
function routeText(n,route){
 if(inExample()){const output=exampleStep(n).outputs.find(o=>o.outputId===route.outputId);return `${output.changes.map((c,i)=>`<section class="example-change"><div class="change-index">第 ${i+1} 次变化</div><div class="change-label">变化前</div><p>${esc(c.before)}</p><div class="change-action"><span class="change-label">操作</span><p>${esc(c.operation)}</p></div><div class="change-result"><span class="change-label">变化后</span><p>${esc(c.after)}</p></div>${annotation(n,'example:change:'+c.id)}</section>`).join('')}${annotation(n,'example:output:'+route.outputId)}`;}
 return `${route.uncertain?'<p class="empty-relation">这个旧模型尚未单独说明此输出的输入来源。请补充关系后再绘制连线。</p>':`<ol class="transformation">${route.steps.map((s,i)=>`<li><span class="number">${i+1}</span><p>${esc(s)}</p></li>`).join('')}</ol>`}${route.legacy&&!route.uncertain?'<div class="legacy-note">按本环节已有的输入与处理说明展示</div>':''}${annotation(n,'derivation:'+route.id)}`;
}
function visualFor(n,route){return inExample()?exampleStep(n)?.outputs.find(o=>o.outputId===route.outputId)?.visual:route.visual;}
function visualField(route,f){return (inExample()?'example:visual:'+route.outputId:'visual:'+route.id)+':'+f.id;}
function routeContent(n,route){
 const visual=visualFor(n,route);if(!visual||route.uncertain)return routeText(n,route);
 const fields=new Set(anchors(n)),hasNotes=feedback.comments.some(c=>c.nodeId===n.id&&fields.has(c.field)&&!c.field.startsWith('visual:')&&!c.field.startsWith('example:visual:')&&(c.field==='derivation:'+route.id||c.field==='example:output:'+route.outputId||exampleStep(n)?.outputs.find(o=>o.outputId===route.outputId)?.changes.some(x=>c.field==='example:change:'+x.id)));
 return `<section class="process-visual" aria-label="处理过程图解"><div id="visual-canvas" class="visual-canvas"></div><div class="visual-caption" aria-live="polite"><h3 id="visual-title"></h3><p id="visual-caption"></p></div><div id="visual-controls" class="visual-controls" ${visual.frames.length===1?'hidden':''}><button data-visual-action="prev">上一步</button><button data-visual-action="play">播放</button><button data-visual-action="next">下一步</button><button data-visual-action="replay">重播</button><span id="visual-count" class="visual-count"></span></div><div id="visual-progress" class="visual-progress" role="group" aria-label="选择演示步骤" ${visual.frames.length===1?'hidden':''}>${visual.frames.map((f,i)=>`<button data-visual-index="${i}" aria-label="第 ${i+1} 步：${esc(f.title)}"></button>`).join('')}</div><div id="visual-frame-note" class="visual-frame-note"></div></section><details class="visual-text" ${hasNotes?'open':''}><summary>文字说明${hasNotes?'与已有批注':''}</summary>${routeText(n,route)}</details>`;
}

// Agent-authored content stays in P's shadow tree; only the host owns interaction and execution.
function sceneMarkup(html){
 const template=document.createElement('template');template.innerHTML=html;
 const tags=new Set('div span p strong em b i small h3 h4 ul ol li table thead tbody tr th td br svg g defs path circle ellipse rect line polyline polygon text tspan lineargradient radialgradient stop clippath mask title desc'.split(' '));
 for(const el of [...template.content.querySelectorAll('*')]){
  if(!tags.has(el.localName.toLowerCase())){el.remove();continue;}
  for(const a of [...el.attributes])if(/^on/i.test(a.name)||['src','srcset','is','tabindex'].includes(a.name.toLowerCase())||(/href$/i.test(a.name)&&!a.value.startsWith('#'))||(/(?:url\s*\(|expression\s*\(|@import|javascript:)/i.test(a.value)&&!/^url\(#[\w-]+\)$/.test(a.value)))el.removeAttribute(a.name);
 }
 return template.content;
}
function stopPlayer(){if(!player)return;clearTimeout(player.timer);player.playing=false;for(const a of player.animations)a.cancel();player.animations=[];updateTransport();}
function updateTransport(){
 if(!player)return;const {visual,index,playing}=player;
 const controls=$('visual-controls');if(!controls)return;
 controls.querySelector('[data-visual-action="prev"]').disabled=index===0;
 controls.querySelector('[data-visual-action="next"]').disabled=index===visual.frames.length-1;
 controls.querySelector('[data-visual-action="play"]').textContent=playing?'暂停':index===visual.frames.length-1?'再播放':'播放';
 $('visual-count').textContent=`${index+1} / ${visual.frames.length}`;
 for(const el of $('visual-progress').children)el.setAttribute('aria-current',Number(el.dataset.visualIndex)===index?'step':'false');
}
function queueFrame(){
 if(!player?.playing)return;
 if(player.index===player.visual.frames.length-1){player.playing=false;updateTransport();return;}
 const p=player;clearTimeout(p.timer);p.timer=setTimeout(()=>{if(player===p&&p.playing)showFrame(p.index+1,true);},p.visual.frames[p.index].holdMs||2800);
}
function showFrame(index,animate=false){
 const p=player;if(!p)return;clearTimeout(p.timer);for(const a of p.animations)a.cancel();p.animations=[];
 p.shadow.querySelector('[data-ghost]')?.remove();
 const old=p.shadow.querySelector('[data-scene]'),oldBox=old?.getBoundingClientRect(),before=new Map();
 if(animate&&!reduced.matches&&old)for(const el of old.querySelectorAll('[data-key]')){const style=getComputedStyle(el);before.set(el.dataset.key,{el,box:el.getBoundingClientRect(),opacity:style.opacity,background:style.backgroundColor,color:style.color,radius:style.borderRadius});}
 const scene=document.createElement('div');scene.dataset.scene='';scene.append(sceneMarkup(p.visual.frames[index].html));
 if(old)old.replaceWith(scene);else p.shadow.append(scene);
 p.index=index;visualPositions.set(p.position,index);const f=p.visual.frames[index];
 $('visual-title').textContent=f.title;$('visual-caption').textContent=f.caption;
 const notes=$('visual-frame-note'),field=visualField(p.route,f);notes.innerHTML=annotation(p.node,field);
 if(animate&&!reduced.matches&&old){
  const tween=(el,frames,duration=650)=>{const a=el.animate(frames,{duration,easing:'cubic-bezier(.22,1,.36,1)',fill:'both'});p.animations.push(a);a.finished.then(()=>a.cancel(),()=>{});};
  const newKeys=new Set();
  for(const el of scene.querySelectorAll('[data-key]')){
   const k=el.dataset.key,previous=before.get(k);newKeys.add(k);
   if(previous){
    const box=el.getBoundingClientRect(),style=getComputedStyle(el);let dx=previous.box.left-box.left,dy=previous.box.top-box.top;
    const sx=box.width?previous.box.width/box.width:1,sy=box.height?previous.box.height/box.height:1;
    if(el instanceof SVGGraphicsElement){const m=el.getScreenCTM();if(m){const v=new DOMPoint(dx,dy).matrixTransform(new DOMMatrix([m.a,m.b,m.c,m.d,0,0]).inverse());dx=v.x;dy=v.y;}el.style.transformBox='fill-box';}
    el.style.transformOrigin='0 0';
    tween(el,[{transform:`translate(${dx}px,${dy}px) scale(${sx},${sy})`,opacity:previous.opacity,backgroundColor:previous.background,color:previous.color,borderRadius:previous.radius},{transform:'translate(0,0) scale(1)',opacity:style.opacity,backgroundColor:style.backgroundColor,color:style.color,borderRadius:style.borderRadius}]);
   }else tween(el,[{opacity:0,transform:'translateY(9px)'},{opacity:getComputedStyle(el).opacity,transform:'translateY(0)'}],450);
  }
  // Keep disappearing objects briefly on the same stage, rather than cutting to a new slide.
  for(const [k,v]of before)if(newKeys.has(k))v.el.style.visibility='hidden';
  old.dataset.ghost='';old.setAttribute('aria-hidden','true');delete old.dataset.scene;Object.assign(old.style,{position:'absolute',left:'0',top:'0',width:oldBox.width+'px',height:oldBox.height+'px',pointerEvents:'none'});p.shadow.append(old);
  const exit=old.animate([{opacity:1},{opacity:0}],{duration:240,easing:'ease-out'});p.animations.push(exit);exit.finished.then(()=>old.remove(),()=>old.remove());
 }
 updateTransport();drawWires();queueFrame();
}
function mountVisual(){
 const canvas=$('visual-canvas');if(!canvas)return;const n=model.nodes.find(n=>n.id===currentId),route=derivations(n).find(d=>d.outputId===selectedOutputs.get(n.id)),visual=visualFor(n,route);
 const shadow=canvas.attachShadow({mode:'open'}),style=document.createElement('style');
 // Local fragment paint servers are useful for SVG; network styles/media are not part of a process illustration.
 if(/@import|expression\s*\(|url\s*\(/i.test(visual.css.replace(/url\(\s*['"]?#[\w-]+['"]?\s*\)/gi,''))){const error=document.createElement('p');error.textContent='图解样式包含外部资源，请改为本地 HTML / SVG。';shadow.append(error);return;}
 style.textContent=':host{display:block}*{box-sizing:border-box}[data-scene]{position:relative;min-height:220px;font:14px/1.5 system-ui,sans-serif;color:#1e3028}'+visual.css;shadow.append(style);
 const position=key(n.id,presentation+':'+route.outputId);player={node:n,route,visual,shadow,position,index:0,playing:false,timer:null,animations:[]};
 canvas.closest('.route-panel').classList.add('visual-route');showFrame(Math.min(visualPositions.get(position)||0,visual.frames.length-1));
}
function visualAction(action,index){
 if(!player)return;const p=player;
 if(action==='play'){if(p.playing){stopPlayer();return;}if(p.index===p.visual.frames.length-1)showFrame(0,true);p.playing=true;updateTransport();queueFrame();return;}
 stopPlayer();if(action==='replay'){showFrame(0,true);p.playing=true;updateTransport();queueFrame();return;}
 showFrame(action==='prev'?Math.max(0,p.index-1):action==='next'?Math.min(p.visual.frames.length-1,p.index+1):index,true);
}
function detail(n){const index=model.nodes.indexOf(n),routes=derivations(n),chosen=selectedOutputs.get(n.id)||n.output.artifactIds[0],route=routes.find(d=>d.outputId===chosen)||routes[0];selectedOutputs.set(n.id,route.outputId);const out=artifacts.get(route.outputId),heading=`<div class="detail-nav"><button class="back" data-home><span>←</span>全部环节</button><div class="step-navigation"><button class="button" ${index?'data-step="'+esc(model.nodes[index-1].id)+'"':'disabled'}>← 上一环节</button><button class="button" ${index<model.nodes.length-1?'data-step="'+esc(model.nodes[index+1].id)+'"':'disabled'}>下一环节 →</button></div></div><section class="detail-heading"><div><span class="eyebrow">第 ${index+1} 步，共 ${model.nodes.length} 步</span><h1 id="view-title" tabindex="-1">${esc(n.title)}</h1>${!inExample()||example?`<p>${esc(ioSummary(n,'input'))} → ${esc(ioSummary(n,'output'))}</p>`:''}</div></section>`;if(inExample()&&!example)return heading+exampleBanner()+orphaned();return `${heading}${exampleBanner()}<div class="output-hint">${routes.length>1?'选择右侧的输出，查看它对应的输入与生成过程。':'沿连线查看这些输入如何变成右侧的结果。'}</div><div class="connection-grid" id="connection-grid"><svg class="wires" id="wires" aria-hidden="true"></svg><section class="io-column inputs"><div class="column-title"><span class="letter">I</span><h2>${inExample()?'本例的输入':'输入内容'}</h2><small>INPUT</small></div>${n.input.artifactIds.map(id=>ioCard(n,id,'input',route)).join('')}</section><section class="route-column"><div class="route-panel ${inExample()?'example-route':''}" id="route-panel"><span class="route-label">${inExample()?'这个例子怎样变化':'处理过程'}</span><h2>${esc(out.name)}，怎样得到？</h2>${routeContent(n,route)}</div></section><section class="io-column outputs"><div class="column-title"><span class="letter">O</span><h2>${inExample()?'本例的结果':'输出内容'}</h2><small>OUTPUT</small></div>${n.output.artifactIds.map(id=>ioCard(n,id,'output',route)).join('')}</section></div>${n.questions.map(q=>`<div class="question"><p>待问清楚：${esc(q.text)}</p><p>${esc(q.impact)}</p>${annotation(n,'question:'+q.id)}</div>`).join('')}${technical(n,route)}${orphaned()}`;}
function orphaned(){const valid=new Set(model.nodes.flatMap(n=>[...anchors(n)].map(f=>key(n.id,f)))),notes=feedback.comments.filter(c=>!valid.has(key(c.nodeId,c.field)));return notes.length?`<section class="orphaned"><h2>原位置已变更的批注</h2><p>保留原文，供继续修改时核对。</p>${notes.map(noteMarkup).join('')}</section>`:'';}
let observer=null,frame=0;
function drawWires(){cancelAnimationFrame(frame);frame=requestAnimationFrame(()=>{const grid=$('connection-grid'),svg=$('wires'),panel=$('route-panel');if(!grid||!svg||!panel)return;const n=model.nodes.find(n=>n.id===currentId);if(!n)return;const route=derivations(n).find(d=>d.outputId===selectedOutputs.get(n.id));if(!route||route.uncertain){svg.innerHTML='';return;}const base=grid.getBoundingClientRect(),r=panel.getBoundingClientRect();svg.setAttribute('viewBox',`0 0 ${base.width} ${base.height}`);const curve=(x1,y1,x2,y2)=>{const gap=Math.max(14,(x2-x1)*.6);return `M ${x1} ${y1} C ${x1+gap} ${y1},${x2-gap} ${y2},${x2} ${y2}`;};const heading=panel.querySelector('h2').getBoundingClientRect(),left=r.left-base.left,right=r.right-base.left,mid=heading.top-base.top+heading.height/2;let lines='';for(const el of grid.querySelectorAll('[data-input-artifact]'))if(route.inputIds.includes(el.dataset.inputArtifact)){const p=el.querySelector('.port').getBoundingClientRect();lines+=`<path class="wire" d="${curve(p.left-base.left+p.width/2,p.top-base.top+p.height/2,left,mid)}"/>`;}const target=[...grid.querySelectorAll('[data-output-card]')].find(el=>el.dataset.outputCard===route.outputId);if(target){const p=target.querySelector('.port').getBoundingClientRect();lines+=`<path class="wire output-wire" d="${curve(right,mid,p.left-base.left+p.width/2,p.top-base.top+p.height/2)}" marker-end="url(#arrow-tip)"/>`;}svg.innerHTML=`<defs><marker id="arrow-tip" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#648753" stroke-width="1.3"/></marker></defs>${lines}`;});}
function render(){const y=scrollY;stopPlayer();player=null;observer?.disconnect();document.querySelectorAll('[data-presentation]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.presentation===presentation)));$('view').innerHTML=currentId?detail(model.nodes.find(n=>n.id===currentId)):overview();mountVisual();if($('connection-grid')){observer=new ResizeObserver(drawWires);observer.observe($('connection-grid'));drawWires();}window.scrollTo({top:y,behavior:'instant'});}
function readLocation(){const id=decodeURIComponent(location.hash.replace(/^#step-/,''));return model.nodes.some(n=>n.id===id)?id:null;}
async function navigate(id,write=true){if(id&&!model.nodes.some(n=>n.id===id))return;stopPlayer();const turn=++navigation;$('view').classList.add('leaving');if(!reduced.matches)await new Promise(resolve=>setTimeout(resolve,145));if(turn!==navigation)return;currentId=id;if(write)history.pushState({},'',id?'#step-'+encodeURIComponent(id):'#overview');render();$('view').classList.remove('leaving');$('view').classList.add('entering');window.scrollTo({top:0,behavior:'instant'});$('view-title')?.focus({preventScroll:true});setTimeout(()=>$('view').classList.remove('entering'),260);}
async function save(){if(!connected||saving||!dirty)return;saving=true;const attempt=edits;status('正在保存批注…');$('retry-save').hidden=true;try{const response=await fetch('/api/feedback',{method:'PUT',headers:{'Content-Type':'application/json','x-ipo-token':token},body:JSON.stringify({baseVersion:feedback.version,feedback:structuredClone(feedback)})});const result=await response.json();if(!response.ok)throw Error(result.error||'保存失败');feedback.version=result.version;if(attempt===edits)dirty=false;stash();status(dirty?'正在保存…':'批注已写入 HTML');}catch(error){status('保存未完成，请重试或保存副本',true);$('retry-save').hidden=false;toast(error.message);}finally{saving=false;if(dirty&&edits!==attempt)save();}}
document.addEventListener('click',event=>{const action=event.target.closest('[data-visual-action]'),frameButton=event.target.closest('[data-visual-index]');if(action){visualAction(action.dataset.visualAction);return;}if(frameButton){visualAction('seek',Number(frameButton.dataset.visualIndex));return;}const mode=event.target.closest('[data-presentation]'),home=event.target.closest('[data-home]'),step=event.target.closest('[data-step]'),output=event.target.closest('[data-select-output]'),add=event.target.closest('[data-add-note]'),cancel=event.target.closest('[data-cancel]');if(mode){if(presentation!==mode.dataset.presentation){presentation=mode.dataset.presentation;navigate(currentId,false);}return;}if(home){navigate(null);return;}if(step){navigate(step.dataset.step);return;}if(output){selectedOutputs.set(currentId,output.dataset.selectOutput);render();return;}if(add){stopPlayer();const wrapper=add.closest('.annotation');openForms.add(key(wrapper.dataset.node,wrapper.dataset.field));wrapper.querySelector('form').hidden=false;wrapper.querySelector('textarea').focus();drawWires();}if(cancel){const w=cancel.closest('.annotation'),k=key(w.dataset.node,w.dataset.field);openForms.delete(k);drafts.delete(k);w.querySelector('textarea').value='';w.querySelector('form').hidden=true;stash();drawWires();}});
document.addEventListener('toggle',event=>{const el=event.target;if(el.matches('details[data-expand]')){if(el.open)expanded.add(el.dataset.expand);else expanded.delete(el.dataset.expand);drawWires();}},true);
document.addEventListener('input',event=>{if(event.target.matches('.note-form textarea')){const w=event.target.closest('.annotation');drafts.set(key(w.dataset.node,w.dataset.field),event.target.value);stash();}});
document.addEventListener('submit',event=>{if(!event.target.matches('.note-form'))return;event.preventDefault();if(!ready){toast('正在读取原有批注，请稍候');return;}const w=event.target.closest('.annotation'),body=w.querySelector('textarea').value.trim();if(!body){toast('请先填写批注');return;}feedback.comments.push({id:crypto.randomUUID(),nodeId:w.dataset.node,field:w.dataset.field,body,createdAt:new Date().toISOString(),agentReply:''});const k=key(w.dataset.node,w.dataset.field);drafts.delete(k);openForms.delete(k);dirty=true;edits++;stash();render();if(connected)save();else{status('批注在浏览器中，请保存副本',true);toast('请保存 HTML 副本交给 agent');}});
$('retry-save').onclick=save;
$('save-html').onclick=()=>{const clone=document.documentElement.cloneNode(true);clone.querySelector('#ipo-model').textContent=safeJson(model);clone.querySelector('#ipo-feedback').textContent=safeJson(feedback);clone.querySelectorAll('.note-form').forEach(form=>{form.hidden=true;form.querySelector('textarea').textContent='';});const url=URL.createObjectURL(new Blob(['<!doctype html>\n'+clone.outerHTML],{type:'text/html;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download=`${model.id}.html`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('副本已包含当前批注');};
window.addEventListener('popstate',()=>navigate(readLocation(),false));window.addEventListener('resize',drawWires);window.addEventListener('beforeunload',event=>{if(dirty||[...drafts.values()].some(x=>x.trim())){event.preventDefault();event.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopPlayer();});reduced.addEventListener('change',stopPlayer);
currentId=readLocation();render();
async function init(){let local;try{local=JSON.parse(localStorage.getItem(storageKey)||'null');}catch{}if(location.protocol==='http:'||location.protocol==='https:')try{const response=await fetch('/api/state',{signal:AbortSignal.timeout(3500)});if(!response.ok)throw Error();const state=await response.json();if(state.projectId!==model.id||state.projectRevision!==model.revision)throw Error();feedback=state.feedback;token=state.token;connected=true;}catch{}if(local?.feedback?.projectId===model.id){for(const [k,v]of local.drafts||[])drafts.set(k,v);if(local.dirty){const known=new Set(feedback.comments.map(c=>c.id));for(const c of local.feedback.comments)if(!known.has(c.id)){feedback.comments.push(c);dirty=true;}}}status(connected?'批注将保存到 HTML':'离线模式 · 批注后请保存副本',!connected);ready=true;render();if(dirty&&connected)save();}
init();
})();
</script>
