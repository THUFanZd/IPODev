<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Running Example</title>
<style>
:root{--page-bg:#f4f6f9;--ink:#243348;--muted:#748096;--accent:#4568bc;--line:#dfe5ee;--font:"Segoe UI Variable Text","PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--page-bg);color:var(--ink);font:14px/1.7 var(--font)}button,input,textarea,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #88a5e5;outline-offset:3px}[hidden]{display:none!important}
.rx-shell{max-width:1360px;margin:auto;padding:0 40px 20px}.rx-head{height:60px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}.rx-brand{font-weight:650;letter-spacing:-.4px}.rx-provenance{font-size:11px;color:var(--muted)}.rx-intro{padding:22px 0 18px;display:flex;align-items:end;justify-content:space-between;gap:20px}.rx-intro h1{font-size:28px;line-height:1.4;letter-spacing:-.6px;margin:0 0 7px;font-weight:600}.rx-intro p{margin:0;color:var(--muted);font-size:13px}.rx-actions{display:flex;gap:8px;flex-shrink:0}.rx-button{border:1px solid var(--line);border-radius:7px;background:white;padding:7px 12px;font-size:12px}.rx-button:hover{border-color:var(--accent)}.rx-button.primary{background:var(--accent);color:white;border-color:var(--accent)}.rx-theatre{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 12px 35px -25px #263c6240}.rx-stage{height:clamp(310px,calc(100svh - 354px),530px);position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#fff,#eef2f7);isolation:isolate}.rx-world{position:absolute;left:50%;top:50%;transform-origin:0 0}.rx-now{padding:14px 22px;border-top:1px solid var(--line);min-height:84px}.rx-now h2{font-size:17px;margin:0 0 4px;font-weight:600}.rx-now p{font-size:12px;color:var(--muted);margin:0}.rx-transport{margin-top:14px;padding:13px 22px 10px;border:1px solid var(--line);border-radius:10px;background:#fff}.rx-toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:7px}.rx-play-actions{display:flex;gap:9px;align-items:center}.rx-hint{font-size:11px;color:var(--muted)}.rx-time{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted)}.rx-range{appearance:none;width:100%;margin:0;height:24px;background:transparent;cursor:ew-resize;touch-action:pan-y}.rx-range::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--accent) var(--progress,0%),#e4e9f1 var(--progress,0%));border-radius:4px}.rx-range::-webkit-slider-thumb{appearance:none;width:13px;height:13px;border-radius:50%;border:3px solid white;background:var(--accent);box-shadow:0 0 0 1px #9cb0d8;margin-top:-5px}.rx-range::-moz-range-track{height:3px;background:#e4e9f1}.rx-range::-moz-range-thumb{width:9px;height:9px;border:2px solid white;background:var(--accent);border-radius:50%}.rx-cues{position:relative;height:27px;margin:0 3px}.rx-cue{position:absolute;transform:translateX(-50%);border:0;background:none;color:var(--muted);font-size:10px;padding:4px 0;max-width:110px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.rx-cue:first-child{transform:none}.rx-cue:last-child{transform:translateX(-100%)}.rx-cue[aria-current=step]{color:var(--accent);font-weight:650}.rx-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:10px;color:var(--muted);font-size:11px}.rx-link{border:0;background:none;padding:0;color:var(--accent);font-size:11px}.rx-error{padding:12px;background:#fff2df;color:#7e5828}.rx-assumptions{font-size:12px;color:var(--muted);margin-top:12px}.rx-assumptions summary{cursor:pointer}
.rx-dialog{width:min(690px,calc(100% - 30px));max-height:86svh;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:24px;color:var(--ink);box-shadow:0 30px 100px #22334d40}.rx-dialog::backdrop{background:#23385250;backdrop-filter:blur(4px)}.rx-dialog-head{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:14px}.rx-dialog h2{font-size:20px;margin:0}.rx-close{border:0;background:none;font-size:22px;color:var(--muted)}.rx-pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.9 var(--font);padding:16px;background:#f5f7fa;border:1px solid var(--line);border-radius:7px}.rx-field{display:block;margin:13px 0;font-size:12px;color:var(--muted)}.rx-field textarea,.rx-field select{display:block;width:100%;margin-top:6px;border:1px solid var(--line);border-radius:6px;padding:10px;color:var(--ink);background:#fff}.rx-field textarea{min-height:95px;resize:vertical}.rx-note{padding:12px 0;border-top:1px solid var(--line);font-size:12px}.rx-note p{white-space:pre-wrap;margin:5px 0}.rx-note small{color:var(--muted)}.rx-note-location{border:0;background:none;color:var(--accent);padding:0;font-size:11px}.rx-note-reply{color:#397769}.rx-status{font-size:12px;color:var(--muted)}.rx-sr{position:absolute;clip-path:inset(50%);width:1px;height:1px;overflow:hidden}
@media(min-width:801px) and (max-height:800px){.rx-shell{padding-bottom:10px}.rx-head{height:48px}.rx-intro{padding:15px 0 14px}.rx-intro h1{font-size:26px;line-height:1.3;margin-bottom:5px}.rx-intro p{font-size:12px}.rx-stage{height:calc(100svh - 410px);min-height:310px}.rx-now{min-height:72px;padding:11px 20px}.rx-transport{margin-top:10px;padding:10px 20px 6px}.rx-toolbar{margin-bottom:4px}.rx-button{padding:5px 10px}.rx-meta{padding-top:7px}.rx-assumptions{margin-top:6px;font-size:11px}}
@media(max-width:800px){.rx-shell{padding-inline:22px}.rx-intro h1{font-size:25px}.rx-hint{display:none}}
@media(max-width:600px){.rx-shell{padding-inline:15px}.rx-head{height:55px}.rx-intro{display:block;padding:22px 0 17px}.rx-intro h1{font-size:24px}.rx-actions{margin-top:14px}.rx-stage{height:430px}.rx-now{padding:15px;min-height:100px}.rx-now h2{font-size:16px}.rx-transport{padding:12px 15px}.rx-meta{align-items:start;font-size:10px}.rx-cue{font-size:9px;max-width:48px}.rx-provenance{font-size:10px}.rx-dialog{padding:20px}}
/*__RUN_CSS__*/
</style></head>
<body>
<main class="rx-shell">
 <header class="rx-head"><span class="rx-brand">Running Example</span><span class="rx-provenance" id="rx-provenance"></span></header>
 <section class="rx-intro"><div><h1 id="rx-title"></h1><p id="rx-subtitle"></p></div><div class="rx-actions"><button class="rx-button" id="rx-details">查看细节</button><button class="rx-button" id="rx-notes">批注 <span id="rx-note-count">0</span></button></div></section>
 <p class="rx-error" id="rx-error" role="alert" hidden></p>
 <section class="rx-theatre" aria-label="运行示例"><div id="rx-stage" class="rx-stage" role="region"><div id="world" class="rx-world">/*__RUN_SCENE__*/</div></div><div class="rx-now" aria-live="polite" aria-atomic="true"><h2 id="rx-now-title"></h2><p id="rx-caption"></p></div></section>
 <section class="rx-transport" aria-label="演示控制"><div class="rx-toolbar"><div class="rx-play-actions"><button id="rx-play" class="rx-button primary">播放</button><button id="rx-replay" class="rx-button" aria-label="从头重播">重播</button><span class="rx-hint">拖动时间线，向前或向后查看变化</span></div><span id="rx-time" class="rx-time"></span></div><label class="rx-sr" for="rx-range">演示进度</label><input id="rx-range" class="rx-range" type="range" min="0" step="0.01" value="0"><div id="rx-cues" class="rx-cues"></div></section>
 <div class="rx-meta"><span id="rx-save-status" role="status">批注可保存在 HTML 中</span><button id="rx-export" class="rx-link">保存 HTML 副本</button></div>
 <details id="rx-assumptions" class="rx-assumptions" hidden><summary>本例的设计假设</summary><ul id="rx-assumption-list"></ul></details>
</main>
<dialog id="rx-inspector" class="rx-dialog" aria-labelledby="rx-inspector-title"><div class="rx-dialog-head"><h2 id="rx-inspector-title">当前时刻的细节</h2><button class="rx-close" id="rx-close-details" aria-label="关闭细节">×</button></div><p id="rx-detail-label" class="rx-status"></p><pre id="rx-detail-content" class="rx-pre"></pre><details><summary>案例的初始内容与最终结果</summary><pre id="rx-example-content" class="rx-pre"></pre></details></dialog>
<dialog id="rx-note-dialog" class="rx-dialog" aria-labelledby="rx-note-title"><div class="rx-dialog-head"><h2 id="rx-note-title">在当前时刻批注</h2><button class="rx-close" id="rx-close-notes" aria-label="关闭批注">×</button></div><p id="rx-note-context" class="rx-status"></p><form id="rx-note-form"><label class="rx-field">关联对象（可选）<select id="rx-note-object"><option value="">整个画面</option></select></label><label class="rx-field">备注<textarea id="rx-note-body" required maxlength="10000" placeholder="这里希望怎样调整？"></textarea></label><button class="rx-button primary" type="submit">保存批注</button></form><p id="rx-note-message" class="rx-status" role="status"></p><div id="rx-note-list"></div></dialog>
<script id="running-story" type="application/json">/*__RUN_STORY__*/</script>
<script id="running-feedback" type="application/json">/*__RUN_FEEDBACK__*/</script>
<script>/*__RUN_GSAP__*/</script>
<script>/*__RUN_SCRIPT__*/</script>
<script>/*__RUN_PLAYER__*/</script>
</body></html>
